<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Every module on the shelf, across seven areas of your dancing.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<meta property="og:title" content="Suim — The Masterplan">
<meta property="og:description" content="Every module on the shelf, across seven areas of your dancing.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="assets/app.css">
<title>SUIM — The Masterplan</title>
<style>
  body{display:flex;flex-direction:column;min-height:100vh}
  .page{flex:1;padding-top:78px;display:grid;grid-template-columns:266px 1fr;align-items:start}

  /* ---- areas rail ---- */
  .rail{position:sticky;top:78px;height:calc(100vh - 78px);overflow-y:auto;background:#fff;border-right:1px solid var(--line);padding:30px 20px 26px;display:flex;flex-direction:column}
  .rail-label{font-size:10px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:#8a908b;margin:0 0 14px}
  .areas{display:flex;flex-direction:column;gap:2px}
  .area{display:grid;grid-template-columns:26px 1fr auto;align-items:center;gap:10px;width:100%;text-align:left;font:inherit;cursor:pointer;
        padding:12px 12px;border:0;border-radius:12px;background:none;color:#6e746f;transition:background .16s,color .16s}
  .area:hover{background:#f1f2ec;color:var(--ink)}
  .area .n{font-size:9.5px;font-weight:800;letter-spacing:.1em;color:#adb2ae;font-variant-numeric:tabular-nums}
  .area .nm{font-size:13.5px;font-weight:700;line-height:1.25}
  .area .ct{font-size:10px;font-weight:800;color:#a5aaa6;font-variant-numeric:tabular-nums}
  .area[aria-current="true"]{background:var(--ink);color:#fff}
  .area[aria-current="true"] .n,.area[aria-current="true"] .ct{color:var(--lime)}
  .area.all{margin-bottom:8px;border-bottom:1px solid var(--line);border-radius:12px 12px 0 0;padding-bottom:16px}
  .area.all[aria-current="true"]{border-bottom-color:var(--ink)}
  .rail-foot{margin-top:auto;padding-top:26px;font-size:11px;color:#8a908b;line-height:1.6}
  .rail-foot b{display:block;color:var(--ink);font-size:13px}

  /* ---- main ---- */
  .main{padding:22px 40px 70px;min-width:0}
  .resume{display:flex;justify-content:flex-end}
  .resume a{display:inline-flex;align-items:center;gap:9px;font-size:11.5px;font-weight:800;letter-spacing:.04em;padding-bottom:5px;border-bottom:2px solid var(--lime);color:var(--ink)}
  .resume a:hover{border-bottom-color:var(--ink)}
  .resume .dim{color:#8a908b;font-weight:700}

  .hero{padding:52px 0 40px;display:flex;justify-content:space-between;align-items:flex-end;gap:40px;border-bottom:1px solid var(--line)}
  .hero .kicker{color:#708000}
  .hero h1{font-size:clamp(46px,6.6vw,104px);line-height:.84;letter-spacing:-.06em;font-weight:900;margin:18px 0 20px;max-width:11ch}
  .hero p{margin:0;max-width:54ch;font-size:16.5px;line-height:1.6;color:var(--muted)}
  .hero-side{text-align:right;white-space:nowrap}
  .hero-side strong{display:block;font-size:30px;letter-spacing:-.045em;line-height:1}
  .hero-side span{font-size:10px;font-weight:700;letter-spacing:.08em;color:#8b918c}

  .bar{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;padding:30px 0 18px}
  .bar h2{margin:0;font-size:19px;letter-spacing:-.035em;font-weight:900}
  .bar .sub{margin:5px 0 0;font-size:11px;color:#8a908b}
  .filters{display:flex;gap:6px;flex-wrap:wrap}
  .f{border:1px solid var(--line);background:#fff;border-radius:24px;padding:8px 14px;font-size:11.5px;font-weight:800;letter-spacing:.03em;color:#6e746f;cursor:pointer;transition:.16s}
  .f:hover{border-color:var(--ink);color:var(--ink)}
  .f[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
  .f i{font-style:normal;opacity:.65;margin-left:6px;font-variant-numeric:tabular-nums}

  /* ---- program cards ---- */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(292px,1fr));gap:14px}
  .card{position:relative;display:flex;flex-direction:column;min-height:262px;padding:22px;border:1px solid var(--line);border-radius:18px;background:#fafbf6;color:inherit;overflow:hidden;transition:transform .22s,border-color .22s}
  a.card:hover{transform:translateY(-5px);border-color:var(--ink)}
  .card .no{position:relative;z-index:2;font-size:10px;font-weight:800;color:#9aa09b;font-variant-numeric:tabular-nums}
  .card .status{position:absolute;right:18px;top:18px;z-index:2;font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:#8a908b}
  .copy{margin-top:auto;position:relative;z-index:2}
  .card .code{font-size:9px;letter-spacing:.17em;text-transform:uppercase;font-weight:800;color:#748000}
  .card h3{margin:9px 0 12px;font-size:31px;line-height:.96;letter-spacing:-.05em;font-weight:900;max-width:13ch}
  .card .meta{display:flex;gap:14px;flex-wrap:wrap;font-size:10.5px;font-weight:600;color:#767c78}
  /* a big cropped numeral so a card without a photo still has something to look at */
  .ghost{position:absolute;left:-10px;top:-34px;z-index:0;font-size:150px;font-weight:900;letter-spacing:-.07em;line-height:1;color:#0b0f0e0d;pointer-events:none;font-variant-numeric:tabular-nums}
  .card.lime .ghost{color:#0b0f0e1f}
  .card.soon .ghost{color:#0b0f0e0a}

  .card:not(.photo) .no{display:none}
  .bars{position:relative;z-index:2;display:flex;gap:3px;margin:0 0 14px}
  .bars i{height:3px;flex:1;border-radius:3px;background:#0b0f0e1a}
  .bars i.on{background:var(--ink)}

  /* variants */
  .card.lime{background:var(--lime);border-color:var(--lime)}
  .card.lime .code{color:#3d4d00}
  .card.lime .no,.card.lime .meta,.card.lime .status{color:#2c3800}
  .card.lime .bars i{background:#0b0f0e29}
  .card.photo{color:#fff;border-color:var(--ink);background:var(--ink);min-height:340px}
  .card.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .card.photo:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0000 12%,#000000d9 100%)}
  .card.photo .no,.card.photo .meta{color:#c3c8c4}
  .card.photo .code{color:var(--lime)}
  .card.photo .bars i{background:#ffffff4d}
  .card.photo .bars i.on{background:var(--lime)}
  .card.featured{grid-column:span 2}
  .card.featured h3{font-size:44px}
  .card.featured .status{background:var(--lime);color:var(--ink);padding:7px 11px;border-radius:99px}
  .card.stage img{object-position:center 34%}
  .card.coach img{object-position:center 14%}
  .card.soon{background:transparent;border-style:dashed;color:#878d88}
  .card.soon .code{color:#8c928d}
  .card.soon h3{color:#71776f}

  .empty{padding:52px 0;color:#8a908b;font-size:15px}

  .fade{animation:fade .3s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  .ko .card h3{font-size:26px;line-height:1.14;max-width:15ch}
  .ko .card.featured h3{font-size:36px}
  .ko .hero h1{font-size:clamp(38px,5.2vw,80px);line-height:1.06;letter-spacing:-.04em}

  @media(max-width:1180px){ .card.featured{grid-column:span 1} .card.featured h3{font-size:34px} }
  @media(max-width:900px){
    .page{grid-template-columns:1fr}
    .rail{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:22px 20px}
    .areas{flex-direction:row;overflow-x:auto;gap:6px;scrollbar-width:none}
    .areas::-webkit-scrollbar{display:none}
    .area{grid-template-columns:auto auto;white-space:nowrap;border-radius:24px;border:1px solid var(--line);padding:10px 14px}
    .area .n{display:none}
    .area.all{margin-bottom:0;border-bottom:1px solid var(--line);border-radius:24px;padding-bottom:10px}
    .rail-foot{display:none}
    .main{padding:18px 20px 60px}
    .hero{padding:34px 0 26px;flex-direction:column;align-items:flex-start;gap:22px}
    .hero-side{text-align:left}
    .resume{justify-content:flex-start}
    .resume .dim{display:none}
  }
  @media(prefers-reduced-motion:reduce){.fade{animation:none}a.card:hover{transform:none}}
</style>
</head>
<body>
<header class="nav" id="appnav"></header>

<div class="page">
  <aside class="rail">
    <p class="rail-label" data-t="railLabel">Training areas</p>
    <div class="areas" id="areas" role="tablist" aria-label="Training areas"></div>
    <div class="rail-foot"><b id="railTotalN">37</b><span data-t="railTotal">programs across 7 areas</span></div>
  </aside>

  <main class="main">
    <div class="resume"><a id="resume" href="session.html?s=1"><span class="dim" data-t="resumeDim">Improvisation 01 ·</span><span data-t="resumeGo">Continue training ↗</span></a></div>

    <section class="hero">
      <div>
        <div class="kicker" id="heroKicker">Area 01 · Your selected path</div>
        <h1 id="heroName">IMPROVISATION</h1>
        <p id="heroBlurb"></p>
      </div>
      <div class="hero-side"><strong id="heroCount">4</strong><span data-t="heroCountL">programs in this area</span></div>
    </section>

    <div class="bar">
      <div><h2 data-t="chooseT">Choose a program</h2><p class="sub" data-t="chooseS">Open one to see its modules and sessions</p></div>
      <div class="filters" id="filters"></div>
    </div>

    <div id="grid" class="grid"></div>
  </main>
</div>

<footer><div class="wrap foot"><b>SUIM<span class="dot">.</span></b><span data-t="footer">Solo salsa training · Built around practice</span><a href="index.html" id="signout" data-t="signout">Sign out</a></div></footer>

<script type="module">
import { esc, initLang, carryLang, signOut } from './assets/app.js';
import { SECTIONS, STATE } from './assets/program-data.js';

const C = {
  en:{
    railLabel:'Training areas', railTotal:'programs across 7 areas',
    allAreas:'All programs', resumeDim:'Improvisation 01 ·', resumeGo:'Continue training ↗',
    yourPath:'Your selected path', everything:'Everything on the shelf',
    heroCountL:'programs in this area', heroCountAll:'programs in total',
    chooseT:'Choose a program', chooseS:'Open one to see its modules and sessions',
    fAll:'All', fOpen:'Open', fNow:'In progress', fSoon:'In production',
    stNow:'In progress', stOpen:'Open', stSoon:'In production', stGuest:'Guest edition',
    empty:'Nothing in this area matches that filter.',
    footer:'Solo salsa training · Built around practice', signout:'Sign out',
    allBlurb:'Every area, every program. Filter by what is open, or narrow to one area on the left.'
  },
  ko:{
    railLabel:'트레이닝 영역', railTotal:'개 프로그램 · 7개 영역',
    allAreas:'전체 프로그램', resumeDim:'즉흥 01 ·', resumeGo:'이어서 트레이닝 ↗',
    yourPath:'선택한 경로', everything:'전체 목록',
    heroCountL:'이 영역의 프로그램', heroCountAll:'전체 프로그램',
    chooseT:'프로그램 선택', chooseS:'열어서 모듈과 세션을 확인하세요',
    fAll:'전체', fOpen:'이용 가능', fNow:'진행 중', fSoon:'제작 중',
    stNow:'진행 중', stOpen:'이용 가능', stSoon:'제작 중', stGuest:'게스트 에디션',
    empty:'이 영역에 해당하는 프로그램이 없습니다.',
    footer:'연습을 중심으로 설계한 솔로 살사 트레이닝', signout:'로그아웃',
    allBlurb:'모든 영역의 모든 프로그램. 이용 가능한 것만 보거나, 왼쪽에서 영역을 좁혀 보세요.'
  }
};

/* Area and filter live in the URL, so a view can be linked to and survives a reload. */
const qs = new URLSearchParams(location.search);
const areaParam = qs.get('area');
let area = areaParam === 'all' ? -1 : Math.max(0, Math.min(6, parseInt(areaParam, 10) || 0));
let filter = ['all', 'open', 'now', 'soon'].includes(qs.get('f')) ? qs.get('f') : 'all';
let dict, lang;

const sessionsOf = m => parseInt(m[5], 10) || 0;

/* Card look is decided by what the program is, then by position, so a long
   grid keeps a rhythm instead of turning into a wall of identical boxes. */
let coachCardKey = null;   /* only one card per view carries the portrait */
function variant(m, i, sectionId){
  if (m[7] === 'current') return 'photo stage featured';
  if (m[7] === 'soon')    return 'soon';
  if (sectionId === 'guest' && m[0] === coachCardKey) return 'photo coach';
  return i % 3 === 1 ? 'lime' : '';
}

function card(m, i, sectionId, areaName){
  const [, title, subtitle, , weeks, sessions, level, state] = m;
  const c = dict;
  const cls = variant(m, i, sectionId);
  const isPhoto = cls.includes('photo');
  const label = state === 'current' ? `${c.stNow} · 4%`
              : state === 'soon' ? c.stSoon
              : (sectionId === 'guest' ? c.stGuest : c.stOpen);
  const n = sessionsOf(m);
  const done = state === 'current' ? 1 : 0;
  const bars = Array.from({ length: n }, (_, k) => `<i class="${k < done ? 'on' : ''}"></i>`).join('');
  const img = cls.includes('stage') ? 'assets/stage.jpg' : cls.includes('coach') ? 'assets/coach.jpg' : '';
  const inner = `${img ? `<img src="${img}" alt="">` : ''}
    ${isPhoto ? '' : `<span class="ghost" aria-hidden="true">${String(i + 1).padStart(2, '0')}</span>`}
    <span class="no">${String(i + 1).padStart(2, '0')}</span>
    <span class="status">${esc(label)}</span>
    <div class="copy">
      <div class="code">${esc(area === -1 ? areaName : title)}</div>
      <h3>${esc(subtitle)}</h3>
      <div class="bars" aria-hidden="true">${bars}</div>
      <div class="meta"><span>${esc(weeks)}</span><span>${esc(sessions)}</span><span>${esc(level)}</span></div>
    </div>`;
  /* Improvisation 01 is the only module built out, so it is the only card that
     navigates — the rest would all land on it, which reads as a broken link. */
  return state === 'current'
    ? `<a class="card ${cls}" href="plan.html">${inner}</a>`
    : `<div class="card ${cls}">${inner}</div>`;
}

function paint(){
  const c = dict, S = SECTIONS[lang];
  const all = area === -1;
  const sec = all ? null : S[area];

  /* rail */
  const total = S.reduce((n, s) => n + s[3].length, 0);
  document.getElementById('areas').innerHTML =
    `<button class="area all" role="tab" type="button" aria-current="${all}" data-a="-1">
       <span class="n">＊</span><span class="nm">${esc(c.allAreas)}</span><span class="ct">${total}</span></button>` +
    S.map((s, i) => `<button class="area" role="tab" type="button" aria-current="${i === area}" data-a="${i}">
       <span class="n">${String(i + 1).padStart(2, '0')}</span>
       <span class="nm">${esc(s[1])}</span><span class="ct">${s[3].length}</span></button>`).join('');
  document.getElementById('railTotalN').textContent = total;

  /* hero */
  document.getElementById('heroKicker').textContent =
    all ? c.everything : `${String(area + 1).padStart(2, '0')} · ${c.yourPath}`;
  document.getElementById('heroName').textContent = all ? c.allAreas : sec[1];
  document.getElementById('heroBlurb').textContent = all ? c.allBlurb : sec[2];

  /* the programs in view */
  const list = all
    ? S.flatMap(s => s[3].map((m, i) => [m, i, s[0], s[1]]))
    : sec[3].map((m, i) => [m, i, sec[0], sec[1]]);
  document.getElementById('heroCount').textContent = list.length;
  document.querySelector('.hero-side span').textContent = all ? c.heroCountAll : c.heroCountL;

  /* filters, each carrying its own count */
  const match = (m, f) => f === 'all' || (f === 'open' && m[7] === 'open') ||
                          (f === 'now' && m[7] === 'current') || (f === 'soon' && m[7] === 'soon');
  const counts = f => list.filter(([m]) => match(m, f)).length;
  document.getElementById('filters').innerHTML = [['all', c.fAll], ['open', c.fOpen], ['now', c.fNow], ['soon', c.fSoon]]
    .map(([k, label]) => `<button class="f" type="button" aria-pressed="${k === filter}" data-f="${k}">${esc(label)}<i>${counts(k)}</i></button>`).join('');

  const shown = list.filter(([m]) => match(m, filter));
  const firstGuest = shown.find(([m, , sid]) => sid === 'guest' && m[7] === 'open');
  coachCardKey = firstGuest ? firstGuest[0][0] : null;
  document.getElementById('grid').innerHTML = shown.length
    ? `<div class="grid fade" style="display:contents">${shown.map(([m, i, sid, sname]) => card(m, i, sid, sname)).join('')}</div>`
    : `<p class="empty">${esc(c.empty)}</p>`;

  document.querySelectorAll('[data-a]').forEach(b => b.addEventListener('click', () => { area = +b.dataset.a; paint(); }));
  document.querySelectorAll('[data-f]').forEach(b => b.addEventListener('click', () => { filter = b.dataset.f; paint(); }));
  document.getElementById('resume').href = `session.html?s=${STATE.session}`;

  const url = new URLSearchParams(location.search);
  url.set('area', all ? 'all' : String(area));
  filter === 'all' ? url.delete('f') : url.set('f', filter);
  history.replaceState(null, '', '?' + url);
  carryLang();
}

initLang(C, (c, l) => { dict = c; lang = l; paint(); }, 'masterplan');
document.getElementById('signout').addEventListener('click', signOut);
</script>
</body>
</html>
