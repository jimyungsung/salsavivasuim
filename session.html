<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="One session: six short videos, one per step of the method.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<meta property="og:title" content="Suim — Session">
<meta property="og:description" content="One session: six short videos, one per step of the method.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="assets/app.css">
<title>SUIM — Session</title>
<style>
  body{display:flex;flex-direction:column;min-height:100vh;padding-top:78px}

  /* ---- session bar ---- */
  .subnav{position:sticky;top:78px;z-index:15;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  .subin{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:14px 0;flex-wrap:wrap}
  .where{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;min-width:0}
  .where .lv{font-size:10.5px;letter-spacing:.17em;text-transform:uppercase;font-weight:800;color:#708000}
  .where h1{margin:0;font-size:19px;letter-spacing:-.035em;font-weight:900}
  .where .len{font-size:11.5px;font-weight:700;color:#8a908b;font-variant-numeric:tabular-nums}
  .hop{display:flex;gap:7px}
  .hop a{display:grid;place-items:center;min-width:40px;height:40px;padding:0 15px;border:1px solid var(--line);border-radius:26px;font-size:12.5px;font-weight:800;color:var(--muted);transition:.18s}
  .hop a:hover{color:var(--ink);border-color:var(--ink);background:#e6e8df}
  .hop a.off{opacity:.35;pointer-events:none}

  .lay{display:grid;grid-template-columns:1fr 356px;gap:22px;padding:26px 0 70px;align-items:start}
  .lay>*{min-width:0}

  /* ---- the player, an ink card like the featured cards elsewhere ---- */
  .player{border-radius:20px;overflow:hidden;background:var(--ink)}
  .frame{position:relative;aspect-ratio:16/9;overflow:hidden;background:repeating-linear-gradient(135deg,#161d19 0 10px,#1b231e 10px 20px)}
  .ph{position:absolute;left:18px;top:18px;z-index:3;font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;font-weight:800;color:#ffffff70;border:1px solid #ffffff2e;border-radius:20px;padding:6px 11px}
  .stack{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:12px;text-align:center;padding:0 24px 60px;transition:transform .45s cubic-bezier(.4,0,.2,1)}
  .frame.mirrored .stack{transform:scaleX(-1)}
  .stack .big{width:76px;height:76px;display:grid;place-items:center;border:0;border-radius:50%;background:var(--lime);color:var(--ink);cursor:pointer;transition:transform .2s}
  .stack .big:hover{transform:scale(1.06)}
  .stack small{font-size:10.5px;letter-spacing:.2em;font-weight:800;color:var(--lime)}
  .stack h2{margin:0;font-size:30px;letter-spacing:-.04em;font-weight:900;color:#fff}
  .stack p{margin:0;max-width:42ch;font-size:14.5px;line-height:1.55;color:#ffffffb5}

  /* overlay controls */
  .pc{position:absolute;left:0;right:0;bottom:0;z-index:4;padding:34px 14px 12px;background:linear-gradient(180deg,transparent,#0b0f0ee6 62%)}
  .ptrack{position:relative;height:4px;border-radius:4px;background:#ffffff2e;cursor:pointer}
  .ptrack .played{position:absolute;left:0;top:0;height:100%;width:0;border-radius:4px;background:var(--lime)}
  .ptrack .loopz{position:absolute;top:-3px;height:10px;border-radius:2px;background:#c6ff003d;border-left:2px solid var(--lime);border-right:2px solid var(--lime);opacity:0;transition:opacity .2s}
  .ptrack .loopz.on{opacity:1}
  .ptrack .tick{position:absolute;top:-2px;width:2px;height:8px;border-radius:2px;background:#ffffff6b}
  .prow{display:flex;align-items:center;gap:6px;margin-top:11px}
  .prow .sp{flex:1}
  .ic{display:grid;place-items:center;width:36px;height:36px;border:0;border-radius:50%;background:none;color:#ffffffc4;cursor:pointer;transition:.16s}
  .ic:hover{background:#ffffff1f;color:#fff}
  .ic[aria-pressed="true"]{background:var(--lime);color:var(--ink)}
  .ic svg{width:19px;height:19px;display:block}
  .ic.play{background:var(--lime);color:var(--ink)}
  .ic.play:hover{background:#d6ff3d}
  .speed{border:0;background:none;color:#ffffffc4;font:inherit;font-size:12px;font-weight:800;letter-spacing:.03em;padding:8px 11px;border-radius:20px;cursor:pointer;transition:.16s;min-width:52px}
  .speed:hover{background:#ffffff1f;color:#fff}
  .speed[data-on="true"]{background:var(--lime);color:var(--ink)}
  .time{font-size:11.5px;font-weight:700;color:#ffffffa3;font-variant-numeric:tabular-nums;padding-left:4px;white-space:nowrap}

  /* ---- the six steps, under the player ---- */
  .steps{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:12px}
  .step{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 6px 9px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--muted);font:inherit;cursor:pointer;transition:.16s;min-width:0}
  .step:hover{border-color:var(--ink);color:var(--ink)}
  .step .sn{font-size:9px;font-weight:800;opacity:.6}
  .step .st{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;text-align:center;line-height:1.2}
  .step .slen{margin-top:3px;font-size:12px;font-weight:800;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
  .step .sat{font-size:9.5px;font-weight:700;opacity:.55;font-variant-numeric:tabular-nums}
  .step[aria-current="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
  .step[aria-current="true"] .st,.step[aria-current="true"] .slen{color:var(--lime)}
  .step.done .st{color:#708000}

  /* ---- what to focus on ---- */
  .about{margin-top:20px;border:1px solid var(--line);border-radius:20px;padding:24px;background:var(--card)}
  .about h3{margin:0;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;font-weight:800;color:#8a908b}
  .cues{margin:16px 0 0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .cues li{border-left:2px solid var(--lime);padding:2px 0 2px 14px;font-size:14.5px;line-height:1.5;color:#4d534e}

  /* ---- videos in this session ---- */
  .side{border:1px solid var(--line);border-radius:20px;background:#fff;overflow:hidden;position:sticky;top:158px}
  .shead{padding:17px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
  .shead b{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;font-weight:800}
  .shead span{font-size:11.5px;font-weight:800;color:#708000;font-variant-numeric:tabular-nums}
  .vid{display:grid;grid-template-columns:92px 1fr;gap:13px;align-items:center;width:100%;padding:12px 16px;border:0;border-bottom:1px solid #11111f12;background:none;color:inherit;text-align:left;cursor:pointer;font:inherit;transition:background .16s}
  .vid:last-of-type{border-bottom:0}
  .vid:hover{background:#f1f2ec}
  .vid[aria-current="true"]{background:var(--ink);color:#fff}
  .vthumb{position:relative;aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:repeating-linear-gradient(135deg,#e7e8e1 0 7px,#eff0e9 7px 14px);display:grid;place-items:center}
  .vid[aria-current="true"] .vthumb{background:repeating-linear-gradient(135deg,#1a221d 0 7px,#20291f 7px 14px)}
  .vthumb .g{width:24px;height:24px;border-radius:50%;background:#0b0f0e14;display:grid;place-items:center;color:var(--ink)}
  .vthumb .g svg{width:11px;height:11px}
  .vid.done .vthumb .g{background:var(--ink);color:var(--lime)}
  .vid[aria-current="true"] .vthumb .g{background:var(--lime);color:var(--ink)}
  .vthumb .d{position:absolute;right:4px;bottom:4px;background:#0b0f0ed9;color:#fff;font-size:9px;font-weight:700;padding:2px 5px;border-radius:4px}
  .vmeta{min-width:0}
  .vmeta .t{display:block;font-size:9.5px;letter-spacing:.15em;font-weight:800;color:#708000}
  .vid[aria-current="true"] .vmeta .t{color:var(--lime)}
  .vid.done .vmeta .t{color:#9aa09b}
  .vmeta .n{display:block;margin-top:2px;font-size:14px;font-weight:700;line-height:1.3}
  .sfoot{padding:14px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
  .sfoot .pill{width:100%}
  .sfoot .note{margin:2px 0 0;font-size:11.5px;color:#9aa09b;line-height:1.5;text-align:center}

  .ko .stack h2{font-size:25px;line-height:1.2}
  @media(max-width:1080px){
    .lay{grid-template-columns:1fr}
    .side{position:static}
    .cues{grid-template-columns:1fr}
  }
  @media(max-width:640px){
    .where h1{font-size:16px}
    .stack h2{font-size:21px}
    .stack p{display:none}
    .steps{grid-template-columns:repeat(3,1fr)}
    .pc{padding:26px 10px 10px}
    .ic{width:32px;height:32px}
    .time{display:none}
  }
  @media(prefers-reduced-motion:reduce){.stack{transition:none}}
</style>
</head>
<body>
<header class="nav" id="appnav"></header>

<div class="subnav"><div class="wrap subin">
  <a class="crumb" href="plan.html"><span aria-hidden="true">←</span><span id="backLabel">Stop Freezing</span></a>
  <div class="where"><span class="lv" id="lvLabel"></span><h1 id="sTitle"></h1><span class="len"><span id="sessLen"></span> <span data-t="totalWord">total</span></span></div>
  <nav class="hop" aria-label="Sessions">
    <a id="prevS" data-t="prevS">← Previous</a>
    <a id="nextS" data-t="nextS">Next session →</a>
  </nav>
</div></div>

<main class="wrap lay">
  <div>
    <div class="player">
      <div class="frame" id="frame">
        <span class="ph" data-t="ph">Video placeholder</span>
        <div class="stack">
          <button class="big" id="bigPlay" data-ta="aPlay" aria-label="Play"><svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button>
          <small id="uKind"></small>
          <h2 id="uHead"></h2>
          <p id="uDesc"></p>
        </div>

        <div class="pc">
          <div class="ptrack" id="ptrack">
            <span class="loopz on" id="loopz" style="left:34%;width:16%"></span>
            <span class="played" id="played"></span>
          </div>
          <div class="prow">
            <button class="ic play" id="play" data-ta="aPlay" aria-label="Play"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button>
            <span class="time" id="time">0:00</span>
            <span class="sp"></span>
            <button class="speed" id="speed" data-on="true" data-ta="aSpeed" aria-label="Playback speed">0.75×</button>
            <button class="ic" id="loop" aria-pressed="true" data-ta="aLoop" aria-label="Loop eight counts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"/><path d="M3 12V10a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 12v2a4 4 0 0 1-4 4H3"/></svg></button>
            <button class="ic" id="mirror" aria-pressed="false" data-ta="aMirror" aria-label="Mirror the picture"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18" stroke-dasharray="3 3"/><path d="M8.5 8.5L4 12l4.5 3.5"/><path d="M15.5 8.5L20 12l-4.5 3.5"/></svg></button>
            <button class="ic" id="counts" aria-pressed="true" data-ta="aCounts" aria-label="Counts on"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="10" width="3" height="9" rx="1.5"/><rect x="8.5" y="6" width="3" height="13" rx="1.5"/><rect x="14" y="12" width="3" height="7" rx="1.5"/><rect x="19.5" y="8" width="3" height="11" rx="1.5"/></svg></button>
            <button class="ic" id="caps" aria-pressed="true" data-ta="aCaps" aria-label="Captions"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="3"/><path d="M9.5 10.5a2.5 2.5 0 1 0 0 3M17 10.5a2.5 2.5 0 1 0 0 3" stroke-linecap="round"/></svg></button>
            <button class="ic" id="full" data-ta="aFull" aria-label="Full screen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
          </div>
        </div>
      </div>
    </div>

    <div class="steps" id="steps"></div>

    <div class="about">
      <h3 data-t="focus">What to focus on</h3>
      <ul class="cues" id="cues"></ul>
    </div>
  </div>

  <aside class="side">
    <div class="shead"><b data-t="listT">Videos in this session</b><span id="listCount"></span></div>
    <div id="vids"></div>
    <div class="sfoot">
      <a class="pill primary sm" id="goNextS" data-t="goNext">Next session →</a>
      <p class="note" data-t="note">Nothing plays — every video here is a placeholder.</p>
    </div>
  </aside>
</main>

<footer><div class="wrap foot"><b>SUIM<span class="dot">.</span></b><span data-t="footer">Solo salsa training · Built around practice</span><a href="index.html" id="signout" data-t="signout">Sign out</a></div></footer>

<script type="module">
import { esc, initLang, carryLang, toggle, signOut } from './assets/app.js';
import { SECTIONS, SESSIONS, UNITS, LEVELS, SESSION_LEVELS, STATE, UNIT_COUNT, durationOf } from './assets/program-data.js';

const C = {
  en:{
    prevS:'← Previous', nextS:'Next session →',
    ph:'Video placeholder',
    aPlay:'Play', aSpeed:'Playback speed', aLoop:'Loop eight counts', aMirror:'Mirror the picture',
    aCounts:'Counts', aCaps:'Captions', aFull:'Full screen',
    focus:'What to focus on', listT:'Videos in this session', totalWord:'total',
    goNext:'Next session →', note:'Nothing plays — every video here is a placeholder.',
    footer:'Solo salsa training · Built around practice', signout:'Sign out',
    last:'Last session', finish:'Finish the module →',
    sessLabel:(n, levels) => `Session ${String(n).padStart(2, '0')} · ${levels}`,
    cues:['Weight, weight, weight — change it fully before you turn.','Let chest and hips travel together; do not twist only the feet.','Direction is a volume knob, not a switch. Do not over-rotate.']
  },
  ko:{
    prevS:'← 이전', nextS:'다음 세션 →',
    ph:'영상 자리 표시',
    aPlay:'재생', aSpeed:'재생 속도', aLoop:'8카운트 반복', aMirror:'좌우 반전',
    aCounts:'카운트', aCaps:'자막', aFull:'전체 화면',
    focus:'이것에 집중하세요', listT:'이 세션의 영상', totalWord:'분량',
    goNext:'다음 세션 →', note:'재생되지 않습니다. 모든 영상은 자리 표시입니다.',
    footer:'연습을 중심으로 설계한 솔로 살사 트레이닝', signout:'로그아웃',
    last:'마지막 세션', finish:'모듈 마치기 →',
    sessLabel:(n, levels) => `세션 ${String(n).padStart(2, '0')} · ${levels}`,
    cues:['체중을 확실히 옮기고 나서 돌아가세요.','발만 비틀지 말고 가슴과 골반이 함께 이동하게 하세요.','방향은 스위치가 아니라 볼륨 조절입니다. 과하게 돌지 마세요.']
  }
};

const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const sessionNo = clamp(parseInt(new URLSearchParams(location.search).get('s'), 10) || STATE.session, 1, 9);
const doneCount = sessionNo === STATE.session ? STATE.unitsDone : 0;
let current = clamp(parseInt(location.hash.replace('#v', ''), 10) || (doneCount + 1), 1, UNIT_COUNT);

const SPEEDS = ['0.5×', '0.75×', '1×', '1.25×'];
let speedIx = 1;
let dict, lang;
const q0 = () => (lang === 'ko' ? '&lang=ko' : '');
/* Where each step sits inside the session, summed from the video lengths so the
   bar stays correct if a video's duration changes. */
const secs = t => { const [m, s2] = String(t).split(':').map(Number); return m * 60 + s2; };
const mmss = n => `${Math.floor(n / 60)}:${String(n % 60).padStart(2, '0')}`;
function spans(U){
  let at = 0;
  return U.map(v => { const d = secs(v[1]); const from = at; at += d; return [mmss(from), mmss(at), v[1]]; });
}

const tick = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l6 6L20 6"/></svg>`;
const tri  = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>`;

function paint(){
  const c = dict, S = SESSIONS[lang], U = UNITS[lang], L = LEVELS[lang];
  const s = S[sessionNo - 1], u = U[current - 1];
  const levels = SESSION_LEVELS[sessionNo - 1].map(k => L[k]).join(' · ');

  document.title = `SUIM — ${s[0]}`;
  document.getElementById('backLabel').textContent =
    SECTIONS[lang].flatMap(x => x[3]).find(m => m[7] === 'current')[2];
  document.getElementById('lvLabel').textContent = c.sessLabel(sessionNo, levels);
  document.getElementById('sTitle').textContent = s[0];

  document.getElementById('uKind').textContent = u[0];
  document.getElementById('uHead').textContent = u[3];
  document.getElementById('uDesc').textContent = u[2];
  document.getElementById('time').textContent = `0:00 / ${u[1]}`;

  /* chapter ticks sit on the scrub bar itself */
  const total = 6;
  document.querySelectorAll('#ptrack .tick').forEach(t => t.remove());
  [28, 55, 78].forEach(pct => {
    const t = document.createElement('span');
    t.className = 'tick'; t.style.left = pct + '%';
    document.getElementById('ptrack').appendChild(t);
  });

  /* the six steps, each with its length and where it falls in the session */
  const sp = spans(U);
  document.getElementById('steps').innerHTML = U.map((v, i) => {
    const n = i + 1;
    return `<button class="step ${n <= doneCount ? 'done' : ''}" type="button" aria-current="${n === current}" data-v="${n}">
      <span class="sn">${n}</span>
      <span class="st">${esc(v[0])}</span>
      <span class="slen">${esc(sp[i][2])}</span>
      <span class="sat">${esc(sp[i][0])}–${esc(sp[i][1])}</span>
    </button>`;
  }).join('');
  document.getElementById('sessLen').textContent = sp[sp.length - 1][1];

  /* the videos */
  document.getElementById('listCount').textContent = `${doneCount} / ${UNIT_COUNT}`;
  document.getElementById('vids').innerHTML = U.map((v, i) => {
    const n = i + 1, isNow = n === current, isDone = n <= doneCount;
    return `<button class="vid ${isDone ? 'done' : ''}" type="button" aria-current="${isNow}" data-v="${n}">
      <span class="vthumb"><span class="g" aria-hidden="true">${isDone && !isNow ? tick : tri}</span><span class="d">${esc(v[1])}</span></span>
      <span class="vmeta"><span class="t">${esc(v[0])}</span><span class="n">${esc(v[3])}</span></span>
    </button>`;
  }).join('');
  document.querySelectorAll('[data-v]').forEach(b => b.addEventListener('click', () => {
    current = +b.dataset.v;
    history.replaceState(null, '', `#v${current}`);
    paint();
  }));

  document.getElementById('cues').innerHTML = c.cues.map(x => `<li>${esc(x)}</li>`).join('');

  /* session paging — a disabled arrow carries no href */
  const q = q0();
  const setHop = (el, href, label) => {
    el.textContent = label;
    if (href) { el.setAttribute('href', href); el.removeAttribute('aria-disabled'); el.classList.remove('off'); }
    else { el.removeAttribute('href'); el.setAttribute('aria-disabled', 'true'); el.classList.add('off'); }
  };
  const hasNext = sessionNo < 9;
  setHop(document.getElementById('prevS'), sessionNo === 1 ? null : `session.html?s=${sessionNo - 1}${q}`, c.prevS);
  setHop(document.getElementById('nextS'), hasNext ? `session.html?s=${sessionNo + 1}${q}` : null, hasNext ? c.nextS : c.last);
  const goNextS = document.getElementById('goNextS');
  goNextS.setAttribute('href', hasNext ? `session.html?s=${sessionNo + 1}${q}` : `plan.html${lang === 'ko' ? '?lang=ko' : ''}`);
  goNextS.textContent = hasNext ? c.goNext : c.finish;

  carryLang();
}

toggle('mirror', on => document.getElementById('frame').classList.toggle('mirrored', on));
toggle('loop', on => document.getElementById('loopz').classList.toggle('on', on));
toggle('counts'); toggle('caps');
document.getElementById('speed').addEventListener('click', e => {
  speedIx = (speedIx + 1) % SPEEDS.length;
  e.currentTarget.textContent = SPEEDS[speedIx];
  e.currentTarget.dataset.on = String(speedIx !== 2);   /* 1x is "off" */
});
const advance = () => {
  if (current < UNIT_COUNT) { current++; history.replaceState(null, '', `#v${current}`); paint(); }
  else document.getElementById('goNextS').click();
};
document.getElementById('play').addEventListener('click', advance);
document.getElementById('bigPlay').addEventListener('click', advance);
document.getElementById('full').addEventListener('click', () => document.getElementById('frame').scrollIntoView({ block: 'center' }));

initLang(C, (c, l) => { dict = c; lang = l; paint(); }, 'training');
document.getElementById('signout').addEventListener('click', signOut);
</script>
</body>
</html>
